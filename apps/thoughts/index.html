<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="inbox-token" content="__TOKEN__">
  <title>Thoughts</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=__ICON_VERSION__">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/branding.css">
  <script src="/app.js" defer></script>
  <script src="/browser.js" defer></script>
</head>
<body>
  <template id="pencil-icon">
    <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/ui-icons.svg#edit"/></svg>
  </template>
  <template id="copy-icon">
    <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/ui-icons.svg#copy"/></svg>
  </template>
  <template id="check-icon">
    <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/ui-icons.svg#check"/></svg>
  </template>
  <template id="trash-icon">
    <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/ui-icons.svg#trash"/></svg>
  </template>
  <main>
    <header><div class="title-row"><h1 class="app-wordmark" aria-label="Thoughts"><span class="visually-hidden">Thoughts</span>__APP_WORDMARK__</h1><button id="open-browser" class="control-button" type="button">Open in browser</button></div><p>A place to leave thoughts while you work.</p></header>
    <p id="browser-status" class="browser-status" role="status" hidden></p>
    <form id="capture">
      <label for="idea">What's on your mind?</label>
      <textarea id="idea" rows="3" maxlength="4000" placeholder="An idea, a reminder, a thing to try..." required></textarea>
      <div class="capture-footer"><span>Ctrl / Cmd + Enter to save</span><button type="submit" id="save" class="control-button"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="/ui-icons.svg#plus"/></svg>Add thought</button></div>
    </form>
    <p id="error" role="alert" hidden></p>
    <nav aria-label="Filter thoughts">
      <button type="button" class="control-button" data-filter="open" aria-pressed="true"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="/ui-icons.svg#inbox"/></svg>Open <span id="open-count">0</span></button>
      <button type="button" class="control-button" data-filter="done" aria-pressed="false"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="/ui-icons.svg#check"/></svg>Done <span id="done-count">0</span></button>
      <button type="button" id="reload" class="control-button refresh-control">Refresh</button>
    </nav>
    <section aria-label="Thoughts" id="list" aria-busy="true"><p class="empty">Loading your thoughts...</p></section>
    <span id="copy-status" class="sr-only" role="status"></span>
    <p id="status" role="status">Saved locally. Shared across your chats.</p>
  </main>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
    <form method="dialog">
      <h2 id="delete-title">Delete thought?</h2>
      <p id="delete-description">This permanently removes the thought.</p>
      <div class="dialog-actions">
        <button value="cancel" class="control-button" autofocus>Cancel</button>
        <button value="delete" class="control-button danger confirm-delete">Delete</button>
      </div>
    </form>
  </dialog>
</body>
</html>
