<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Image - Artifacts</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="branding.css">
    <link rel="stylesheet" href="image-preview.css">
    <script src="image-preview.js" type="module"></script>
</head>
<body>
    <button id="close-image" class="control-button icon-button" type="button" aria-label="Close image window" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
    </button>
    <main aria-label="Image preview" aria-busy="true">
        <h1 class="visually-hidden">Image preview</h1>
        <p id="image-status" role="status">Loading image...</p>
        <img id="image" alt="" hidden>
    </main>
</body>
</html>
