<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="inbox-token" content="__TOKEN__">
  <title>Thoughts</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <template id="pencil-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg>
  </template>
  <template id="copy-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg>
  </template>
  <template id="check-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg>
  </template>
  <main>
    <header><h1>Thoughts</h1><p>A place to leave thoughts while you work.</p></header>
    <form id="capture">
      <label for="idea">What's on your mind?</label>
      <textarea id="idea" rows="3" maxlength="4000" placeholder="An idea, a reminder, a thing to try..." required></textarea>
      <div class="capture-footer"><span>Ctrl / Cmd + Enter to save</span><button type="submit" id="save">Add thought</button></div>
    </form>
    <p id="error" role="alert" hidden></p>
    <nav aria-label="Filter thoughts">
      <button type="button" data-filter="open" aria-pressed="true">Open <span id="open-count">0</span></button>
      <button type="button" data-filter="done" aria-pressed="false">Done <span id="done-count">0</span></button>
      <button type="button" id="reload">Reload</button>
    </nav>
    <section aria-label="Thoughts" id="list" aria-busy="true"><p class="empty">Loading your thoughts...</p></section>
    <span id="copy-status" class="sr-only" role="status"></span>
    <p id="status" role="status">Saved locally. Shared across your chats.</p>
  </main>
</body>
</html>
